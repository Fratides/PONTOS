<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu e-mail</title>
  </head>
  <body style="margin: 0; padding: 32px 16px; background-color: #f4f4f8; font-family: Arial, Helvetica, sans-serif; color: #242236;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 520px; margin: 0 auto; background-color: #ffffff; border-radius: 16px;">
      <tr>
        <td align="center" style="padding: 36px 28px;">
          <img
            src="{{ .SiteURL }}/logo/points.png"
            width="96"
            height="96"
            alt="Points"
            style="display: block; width: 96px; height: 96px; margin: 0 auto 24px; border: 0;"
          />
          <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3;">Confirme seu e-mail</h1>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5;">
            Digite o código abaixo no aplicativo para confirmar seu endereço de e-mail e concluir o cadastro.
          </p>
          <p style="margin: 0 0 24px; padding: 16px; border-radius: 10px; background-color: #f1efff; color: #4828a8; font-size: 32px; font-weight: 700; letter-spacing: 8px;">
            {{ .Token }}
          </p>
          <p style="margin: 0; color: #696779; font-size: 14px; line-height: 1.5;">
            Se você não solicitou esse cadastro, ignore esta mensagem.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
